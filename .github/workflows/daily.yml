name: 每日抓取人民日报 PDF

# 每天北京时间 08:00 运行（UTC 00:00），也可以在 Actions 页面手动点 Run workflow 立即跑一次。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并合并当日 PDF（单次运行，不进死循环）
        run: python rmrb_download.py --once

      - name: 下载中文字体（文章汇总版 PDF 排版用）
        run: |
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifsc/NotoSerifSC%5Bwght%5D.ttf" -o NotoSerifSC.ttf
          # 这个字体文件是可变字体，默认字重是 200（特细），直接用会比原来的宋体细很多；
          # 用 fonttools 把它固定到 400（常规字重），再交给爬虫用。
          python -c "from fontTools.ttLib import TTFont; from fontTools.varLib.instancer import instantiateVariableFont; f = TTFont('NotoSerifSC.ttf'); instantiateVariableFont(f, {'wght': 400}, inplace=True); f.save('NotoSerifSC-Regular.ttf')"
          ls -lh NotoSerifSC-Regular.ttf
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf" -o NotoSansSC.ttf
          # 小标题用黑体：把可变字体固定到 700（粗体），再交给爬虫用。
          python -c "from fontTools.ttLib import TTFont; from fontTools.varLib.instancer import instantiateVariableFont; f = TTFont('NotoSansSC.ttf'); instantiateVariableFont(f, {'wght': 700}, inplace=True); f.save('NotoSansSC-Bold.ttf')"
          ls -lh NotoSansSC-Bold.ttf

      - name: 抓取当日文章并生成文章汇总版 PDF
        # 文章汇总失败也不让整个任务停下来：完整版照样归档提交，
        # 失败原因可以在这一步的日志里看到。
        continue-on-error: true
        run: python article_crawler.py --font NotoSerifSC-Regular.ttf --subhead-font NotoSansSC-Bold.ttf

      - name: 归档到 pdfs/ 并生成目录
        run: |
          set -e
          mkdir -p pdfs
          # 爬虫输出在“人民日报下载/人民日报-YYYY-MM-DD-完整版.pdf”
          for f in 人民日报下载/人民日报-*-完整版.pdf; do
            [ -e "$f" ] || continue
            date="$(echo "$f" | sed -E 's/.*-([0-9]{4}-[0-9]{2}-[0-9]{2})-完整版\.pdf/\1/')"
            cp "$f" "pdfs/${date}.pdf"
            echo "归档: $f -> pdfs/${date}.pdf"
          done
          # 文章汇总版输出在“人民日报下载/人民日报-YYYY-MM-DD-文章汇总版.pdf”
          for f in 人民日报下载/人民日报-*-文章汇总版.pdf; do
            [ -e "$f" ] || continue
            date="$(echo "$f" | sed -E 's/.*-([0-9]{4}-[0-9]{2}-[0-9]{2})-文章汇总版\.pdf/\1/')"
            cp "$f" "pdfs/${date}-article.pdf"
            echo "归档: $f -> pdfs/${date}-article.pdf"
          done
          python generate_index.py
          ls -lh pdfs/

      - name: 提交新 PDF 和目录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdfs index.json
          # 没有新文件就不提交，避免空提交
          git diff --cached --quiet || git commit -m "更新人民日报 PDF $(date -u +%Y-%m-%d)"
          git push
